<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CMMS - PM Scheduling</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Smart CMMS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/inventory">Inventory</a>
                <a class="nav-link active" href="/schedules">PM Schedules</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h2 class="fw-bold m-0">Preventive Maintenance Schedules</h2>
                <small class="text-muted">Automated Time-Based Work Order Generation</small>
            </div>
            <div>
                <button class="btn btn-outline-secondary me-2" onclick="triggerManualPMCheck()">Run Auto-PM Check</button>
                <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPmModal">+ Create PM Schedule</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Schedule Title</th>
                                <th>Target Asset</th>
                                <th>Frequency (Days)</th>
                                <th>Last Generated</th>
                                <th>Next Due Date</th>
                                <th>Assigned Tech</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="pmTableBody">
                            <!-- Populated dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding Schedule -->
    <div class="modal fade" id="addPmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">New Preventive Schedule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addPmForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Task Title *</label>
                            <input type="text" class="form-control" name="title" placeholder="e.g. Monthly Conveyor Lubrication" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Target Asset *</label>
                            <select class="form-select" name="asset_id" id="assetSelect" required>
                                <option value="">Select Asset...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Frequency (Days) *</label>
                            <input type="number" class="form-control" name="frequency_days" value="30" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">First Due Date</label>
                            <input type="date" class="form-control" name="next_due_date">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Assigned Technician</label>
                            <input type="text" class="form-control" name="assigned_technician" placeholder="e.g. John Doe">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-success">Save Schedule</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadAssetsForDropdown() {
            try {
                const res = await fetch('/api/assets');
                const assets = await res.json();
                const select = document.getElementById('assetSelect');
                select.innerHTML = '<option value="">Select Asset...</option>';
                assets.forEach(a => {
                    select.innerHTML += `<option value="${a.id}">${a.name} (${a.asset_code})</option>`;
                });
            } catch (err) {
                console.error('Error loading assets:', err);
            }
        }

        async function loadSchedules() {
            try {
                const res = await fetch('/api/pm_schedules');
                const schedules = await res.json();
                const tbody = document.getElementById('pmTableBody');
                tbody.innerHTML = '';

                schedules.forEach(s => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${s.id}</td>
                        <td><strong>${s.title}</strong></td>
                        <td>${s.asset_name}</td>
                        <td>Every ${s.frequency_days} days</td>
                        <td>${s.last_generated_date}</td>
                        <td><span class="badge bg-info text-dark">${s.next_due_date}</span></td>
                        <td>${s.assigned_technician}</td>
                        <td>
                            ${s.is_active 
                                ? '<span class="badge bg-success">Active</span>' 
                                : '<span class="badge bg-secondary">Inactive</span>'}
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error('Error loading schedules:', err);
            }
        }

        async function triggerManualPMCheck() {
            try {
                const res = await fetch('/api/pm_schedules/trigger', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
                loadSchedules();
            } catch (err) {
                console.error('Error triggering PM check:', err);
            }
        }

        document.getElementById('addPmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            try {
                const res = await fetch('/api/pm_schedules', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addPmModal')).hide();
                    e.target.reset();
                    loadSchedules();
                } else {
                    const err = await res.json();
                    alert('Error: ' + err.error);
                }
            } catch (err) {
                console.error('Error adding PM schedule:', err);
            }
        });

        loadAssetsForDropdown();
        loadSchedules();
    </script>
</body>
</html>
