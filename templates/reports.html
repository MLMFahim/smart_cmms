<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart CMMS - Cost Reports & Exports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">Smart CMMS</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/inventory">Inventory</a>
                <a class="nav-link" href="/schedules">PM Schedules</a>
                <a class="nav-link active" href="/reports">Reports</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="fw-bold m-0">Maintenance Cost Reports</h2>
                <small class="text-muted">Lifecycle Costs & Financial Analysis</small>
            </div>
            <div>
                <a href="/api/reports/export/csv" class="btn btn-success fw-bold">📥 Export Work Orders CSV</a>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-primary text-white">
                    <div class="card-body">
                        <h6>Total Maintenance Spent</h6>
                        <h3 class="fw-bold m-0" id="totalCost">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-secondary text-white">
                    <div class="card-body">
                        <h6>Parts Expenses</h6>
                        <h3 class="fw-bold m-0" id="partsCost">$0.00</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm border-0 bg-dark text-white">
                    <div class="card-body">
                        <h6>Labor Expenses</h6>
                        <h3 class="fw-bold m-0" id="laborCost">$0.00</h3>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white fw-bold">Cost Breakdown by Asset</div>
            <div class="card-body p-0">
                <ul class="list-group list-group-flush" id="assetCostList">
                    <li class="list-group-item text-muted">Loading cost data...</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function loadCostReports() {
            try {
                const res = await fetch('/api/reports/maintenance_costs');
                const data = await res.json();

                document.getElementById('totalCost').innerText = `$${data.total_maintenance_cost.toFixed(2)}`;
                document.getElementById('partsCost').innerText = `$${data.total_parts_cost.toFixed(2)}`;
                document.getElementById('laborCost').innerText = `$${data.total_labor_cost.toFixed(2)}`;

                const list = document.getElementById('assetCostList');
                list.innerHTML = '';

                const entries = Object.entries(data.asset_cost_breakdown);
                if (entries.length === 0) {
                    list.innerHTML = '<li class="list-group-item text-muted">No completed maintenance cost data found.</li>';
                    return;
                }

                entries.forEach(([assetName, cost]) => {
                    list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <span><strong>${assetName}</strong></span>
                            <span class="badge bg-primary fs-6">$${cost.toFixed(2)}</span>
                        </li>
                    `;
                });
            } catch (err) {
                console.error('Error loading cost report:', err);
            }
        }

        loadCostReports();
    </script>
</body>
</html>
